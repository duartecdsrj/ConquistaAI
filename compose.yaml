services:
  nginx:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build: ./docker/nginx
    ports:
      - "${HTTP_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_started
      frontend:
        condition: service_healthy
    networks: [public, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: ./apps/web
      target: development
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      E2E_EMAIL: ${E2E_EMAIL:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    networks: [public, internal]
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 15

  api:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-concursos-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      SYLLABUS_DOCUMENT_DIRECTORY: ${SYLLABUS_DOCUMENT_DIRECTORY:-/app/storage/syllabi}
      QUESTION_PDF_DOCUMENT_DIRECTORY: ${QUESTION_PDF_DOCUMENT_DIRECTORY:-/app/storage/question-pdfs}
      DISCOVERY_PROVIDER_BASE_URL: ${DISCOVERY_PROVIDER_BASE_URL:-}
      DISCOVERY_ALLOWED_HOSTS: ${DISCOVERY_ALLOWED_HOSTS:-}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      E2E_EMAIL: ${E2E_EMAIL:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - syllabus_documents:/app/storage/syllabi
      - question_pdf_documents:/app/storage/question-pdfs
      - question_pdf_assets:/app/storage/question-pdf-assets
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/health\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 3s
      retries: 15

  syllabus-worker:
    build: ./apps/api
    command: ["sh", "-c", "while true; do php bin/process-syllabus-jobs.php; sleep 5; done"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - syllabus_documents:/app/storage/syllabi
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]

  question-pdf-worker:
    build: ./apps/api
    command: ["sh", "-c", "while true; do php bin/process-question-pdf-imports.php; sleep 5; done"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - question_pdf_documents:/app/storage/question-pdfs
      - question_pdf_assets:/app/storage/question-pdf-assets
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]

  question-correction-worker:
    build: ./apps/api
    command: ["sh", "-c", "while true; do php bin/process-question-corrections.php; sleep 5; done"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORRECTION_CODEX_TIMEOUT: ${CORRECTION_CODEX_TIMEOUT:-180}
      CORRECTION_CODEX_NETWORK: ${CORRECTION_CODEX_NETWORK:-conquistaai_public}
      CORRECTION_WORKSPACE_VOLUME: ${CORRECTION_WORKSPACE_VOLUME:-conquistaai_correction_workspaces}
      CODEX_AUTH_VOLUME: ${CODEX_AUTH_VOLUME:-conquistaai_codex_auth}
      REALTIME_URL: http://realtime:9010/internal/events
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-${JWT_SECRET}}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - question_pdf_documents:/app/storage/question-pdfs:ro
      - question_pdf_assets:/app/storage/question-pdf-assets
      - correction_workspaces:/correction-workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]

  question-explanation-worker:
    build: ./apps/api
    command: ["sh", "-c", "while true; do php bin/process-question-explanations.php; sleep 5; done"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      EXPLANATION_CODEX_TIMEOUT: ${EXPLANATION_CODEX_TIMEOUT:-180}
      EXPLANATION_CODEX_NETWORK: ${EXPLANATION_CODEX_NETWORK:-conquistaai_public}
      CORRECTION_WORKSPACE_VOLUME: ${CORRECTION_WORKSPACE_VOLUME:-conquistaai_correction_workspaces}
      CODEX_AUTH_VOLUME: ${CODEX_AUTH_VOLUME:-conquistaai_codex_auth}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - correction_workspaces:/correction-workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]

  codex-runner:
    build: ./docker/codex-runner
    image: concursos-codex-runner
    profiles: ["runner"]
    command: ["--version"]
    networks: [public]

  codex-auth:
    image: concursos-codex-runner
    profiles: ["auth"]
    entrypoint: ["codex"]
    command: ["login", "--device-auth"]
    stdin_open: true
    tty: true
    volumes:
      - codex_auth:/root/.codex
    networks: [public]

  realtime:
    build:
      context: ./apps/web
      target: development
    command: ["node", "/app/realtime-server.mjs"]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-${JWT_SECRET}}
      REALTIME_PORT: 9010
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:9010/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-concursos}
      MYSQL_USER: ${MYSQL_USER:-concursos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  public:
  internal:
    internal: true

volumes:
  mysql_data:
  api_vendor:
  web_node_modules:
  syllabus_documents:
  question_pdf_documents:
  question_pdf_assets:
  correction_workspaces:
  codex_auth:
