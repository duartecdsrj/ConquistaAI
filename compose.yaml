services:
  nginx:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build: ./docker/nginx
    ports:
      - "${HTTP_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [public, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: ./apps/web
      target: development
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      E2E_EMAIL: ${E2E_EMAIL:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
    networks: [public, internal]
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 15

  api:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-concursos-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      SYLLABUS_DOCUMENT_DIRECTORY: ${SYLLABUS_DOCUMENT_DIRECTORY:-/app/storage/syllabi}
      QUESTION_PDF_DOCUMENT_DIRECTORY: ${QUESTION_PDF_DOCUMENT_DIRECTORY:-/app/storage/question-pdfs}
      DISCOVERY_PROVIDER_BASE_URL: ${DISCOVERY_PROVIDER_BASE_URL:-}
      DISCOVERY_ALLOWED_HOSTS: ${DISCOVERY_ALLOWED_HOSTS:-}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      E2E_EMAIL: ${E2E_EMAIL:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - syllabus_documents:/app/storage/syllabi
      - question_pdf_documents:/app/storage/question-pdfs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/health\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 3s
      retries: 15

  syllabus-worker:
    build: ./apps/api
    command: ["sh", "-c", "while true; do php bin/process-syllabus-jobs.php; sleep 5; done"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - syllabus_documents:/app/storage/syllabi
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]

  question-pdf-worker:
    build: ./apps/api
    command: ["sh", "-c", "while true; do php bin/process-question-pdf-imports.php; sleep 5; done"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-concursos}
      DB_USER: ${DB_USER:-concursos}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor
      - question_pdf_documents:/app/storage/question-pdfs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [public, internal]

  mysql:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-concursos}
      MYSQL_USER: ${MYSQL_USER:-concursos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  public:
  internal:
    internal: true

volumes:
  mysql_data:
  api_vendor:
  web_node_modules:
  syllabus_documents:
  question_pdf_documents:
